# rayakala-landing — nginx reverse proxy for rayakala.ink + www (80 -> 127.0.0.1:5001).
# Co-exists with monthly-logs (money.rayakala.ink -> 5000). Do NOT remove that site.
# Install: cp to /etc/nginx/sites-available/rayakala-landing,
# symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS: sudo bash scripts/setup-tls.sh (certbot --nginx -d rayakala.ink -d www.rayakala.ink).
upstream rayakala_landing {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    listen [::]:80;
    server_name rayakala.ink www.rayakala.ink;

    client_max_body_size 1m;

    location / {
        proxy_pass http://rayakala_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
